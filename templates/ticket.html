<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ticket.css') }}">
  <title>Ticket System</title>
</head>
<body>

<button id="theme-switch" onclick="toggleTheme()">Switch to Light Theme</button>

<div class="main-ticket">
  <div class="card-ticket">
    <form method="POST">
      <div class="textfield">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="100" placeholder="Title" required>
      </div>
      <div class="textfield">
        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="">Please select...</option>
          <option value="IT">IT</option>
          <option value="HR">HR</option>
          <option value="Finance">Finance</option>
          <option value="Marketing">Marketing</option>
        </select>
      </div>
      <div class="textfield">
        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="1000" required></textarea>
      </div>
      <button type="submit" class="btn-ticket">Create Ticket</button>
    </form>
    <!-- Flash messages display section -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash-message {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  </div>
</div>

<script>
  window.onload = function() {
    var flashMessages = document.querySelectorAll('.flash-message');
    if(flashMessages.length) {
      history.replaceState(null, null, window.location.href.split('?')[0]);
    }
    setTimeout(function() {
      flashMessages.forEach(function(msg) {
        msg.style.opacity = '0';
        setTimeout(function() { msg.style.display = 'none'; }, 500);
      });
    }, 3000);
  };

  function toggleTheme() {
    var body = document.body;
    var themeSwitchButton = document.getElementById('theme-switch');
    body.classList.toggle('light-theme');

    if (body.classList.contains('light-theme')) {
      themeSwitchButton.innerText = 'Switch to Dark Theme';
    } else {
      themeSwitchButton.innerText = 'Switch to Light Theme';
    }
  }

</script>
</body>
</html>
